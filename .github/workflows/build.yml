name: Android CI/CD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Set up debug keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
      run: |
        mkdir -p ~/.android
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
        else
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
        fi
    - name: Build Debug APK
      run: gradle assembleDebug
    - name: Extract Version Name
      id: get_version
      run: |
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
    - name: Get SHA-256 from debug.keystore
      run: |
        keytool -list -v -keystore ~/.android/debug.keystore \
          -alias androiddebugkey -storepass android -keypass android \
          | grep "SHA256"
    - name: Rename Debug APK
      run: |
        VERSION_NAME="${{ steps.get_version.outputs.VERSION_NAME }}"
        cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/NightRead-debug-v$VERSION_NAME.apk"
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NightRead-debug-v${{ steps.get_version.outputs.VERSION_NAME }}
        path: app/build/outputs/apk/debug/NightRead-debug-v${{ steps.get_version.outputs.VERSION_NAME }}.apk
